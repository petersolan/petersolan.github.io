# Content for petersolan.github.io. Edit this file, push, and the site rebuilds (scripts/build.py).
# Empty links are simply not shown, so nothing half-finished ever appears on the live site.

profile:
  name: Peter S
  role: Geospatial data engineer
  location: London, UK
  coordinates: "51.5281° N, 0.1331° W"   # London Euston station
  intro: >-
    I build data pipelines that turn open geospatial and demographic data into reliable,
    documented datasets and maps: from LiDAR and Sentinel-2 to census, postcode and network data,
    on Databricks, Azure and PostGIS.
  looking_for: Open to geospatial data engineering roles.
  links:
    github: https://github.com/petersolan
    linkedin: https://www.linkedin.com/in/petersolan/
    email: ""           # e.g. name@example.com
    cv: ""              # e.g. assets/cv.pdf (add the PDF to assets/)

projects:
  - id: signal
    title: Exeter 4G/5G Coverage Checker & Network Business Case
    repo: https://github.com/petersolan/Mobile-Signal-Strength
    demos:
      - {label: Coverage checker, url: "https://petersolan.github.io/Mobile-Signal-Strength/coverage.html"}
      - {label: Signal Atlas, url: "https://petersolan.github.io/Mobile-Signal-Strength/"}
      - {label: Executive briefing, url: "https://petersolan.github.io/Mobile-Signal-Strength/deck.html"}
      - {label: Business case, url: "https://github.com/petersolan/Mobile-Signal-Strength#business-case-coverage-gaps-opportunities-and-where-to-build"}
    image: assets/img/coverage.webp
    image_alt: Modelled 5G signal of EE across central Exeter, strong around the masts and patchy behind hills
    summary: >-
      A mobile coverage model from Ofcom's open drive tests: 531 4G cells located from the measurements,
      terrain diffraction over Environment Agency LiDAR, clutter loss fitted per operator, and 5G on the
      estimated masts. Validated on held-out areas (12-15 dB RMSE), then counted against 152,000 Census
      residents to show who gets indoor 4G or good 5G from each operator, in any area you draw. On top, a
      business case: where each operator loses customers to rivals, which places matter most (Census
      demographics), a costed site plan with break-even per site under two calibration scenarios, the same
      analysis in SQL, a pilot design for the drive test, and an executive briefing.
    tags: [RF propagation modelling, 4G/5G, Competitive analysis, Business case, Ofcom open data, LiDAR, Census 2021, Model validation, MapLibre]

  - id: databricks
    title: Demographic & Geospatial Pipelines on Databricks
    repo: https://github.com/petersolan/GB-Demographic-Geospatial-Databricks
    live: https://petersolan.github.io/GB-Demographic-Geospatial-Databricks/
    image: assets/img/databricks.webp
    image_alt: Registered patients per Census resident by LSOA around Exeter, with suppressed areas hatched
    summary: >-
      A medallion pipeline on Databricks joining (synthetic) GP registrations to NHS and ONS postcode,
      ODS and boundary data: native spatial joins in British National Grid, versioned lookups,
      reconciliation, pseudonymisation and disclosure control. Monthly updates arrive incrementally
      (Auto Loader, then MERGE into an effective-dated history); calibrated against real NHS England
      counts; an AI/BI dashboard with a map, deployed as code.
    tags: [Databricks, PySpark, Delta Lake, Unity Catalog, Spatial SQL, Auto Loader, Asset Bundles, AI/BI Dashboards, GitHub Actions]

  - id: census
    title: GB Census Population Map
    repo: https://github.com/petersolan/GB-Census-Population-Map
    live: https://petersolan.github.io/GB-Census-Population-Map/cog.html
    image: assets/img/census.webp
    image_alt: Population per 10 m cell in central London, dark basemap with red population cells
    summary: >-
      Census 2021/2022 population shared out to 41.6 million address points (UPRNs) across Great
      Britain using building footprints, then rasterised to a 10 m grid and served as a
      cloud-optimised GeoTIFF to an interactive map with click-to-identify.
    tags: [Python, Census 2021, UPRN, Dasymetric mapping, Cloud-optimised GeoTIFF, GeoLibre]

  - id: lidar
    title: Exeter 3D City Model
    repo: https://github.com/petersolan/Exeter-3D-City-Model
    live: https://petersolan.github.io/Exeter-3D-City-Model/
    image: assets/img/lidar.webp
    image_alt: Building footprints in central Exeter shaded by height above ground over a LiDAR hillshade
    summary: >-
      A LiDAR digital twin base layer: building footprints with heights, 127k individual tree crowns
      and terrain for Exeter from Environment Agency LiDAR, validated against Ordnance Survey and
      outperforming Microsoft and OpenStreetMap buildings, in a 3D web viewer.
    tags: [LiDAR, 3D city model, Machine learning, Sentinel-2, OpenStreetMap, MapLibre]

  - id: fibre
    title: Fibre Planning Pipeline
    repo: https://github.com/petersolan/GB-Fibre-Planning-Pipeline
    live: https://petersolan.github.io/GB-Fibre-Planning-Pipeline/
    image: assets/img/fibre.webp
    image_alt: Proposed cable network in central Exeter, gap streets in red and connecting routes in blue
    summary: >-
      Which premises lack gigabit broadband, and which roads reach them: Ofcom coverage, census
      population per address and OS Open Roads combined into a ranked build plan. A Kedro pipeline
      into PostGIS, with a FastAPI service, GeoServer layers and a QGIS plugin.
    tags: [Kedro, PostGIS, pgRouting, Alembic, FastAPI, GeoServer, QGIS, Docker]

  - id: greenspace
    title: Green Space Indicators for Devon
    repo: https://github.com/petersolan/GB-Green-Space-Indicators
    live: https://petersolan.github.io/GB-Green-Space-Indicators/
    image: assets/img/greenspace.webp
    image_alt: Mean summer greenness (Sentinel-2 NDVI) for every LSOA in Devon, green choropleth
    summary: >-
      Share of residents within 300 m of public green space and summer greenness from Sentinel-2,
      for every Devon LSOA. Built as a geospatial lakehouse on Azure (ADLS Gen2, Delta Lake) and
      published with ISO 19115, DCAT-AP and SDMX metadata.
    tags: [Azure, Delta Lake, Sentinel-2, Xarray, ISO 19115, DCAT-AP, SDMX]

  - id: trees
    title: Fallen Trees from Aerial Imagery
    earlier: true
    repo: https://github.com/petersolan/DL-CNN-Aerial-Images
    image: assets/img/fallen_trees.webp
    image_alt: Aerial photo of storm damage with fallen trees between houses
    summary: >-
      MSc thesis: detecting storm-felled trees in urban aerial imagery with a YOLOv3 convolutional
      neural network.
    tags: [Deep learning, YOLOv3, Computer vision]

